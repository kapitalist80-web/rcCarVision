<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEGO 42140 Control + Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 8px;
            color: #fff;
            touch-action: manipulation;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 20px;
        }
        
        .header {
            text-align: center;
            padding: 8px 0;
            margin-bottom: 8px;
        }
        
        .header h1 {
            font-size: 18px;
            margin-bottom: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        /* Video Stream */
        .video-container {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 75%; /* 4:3 Aspect Ratio */
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .video-stream {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .video-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        
        .status-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 6px;
        }
        
        .status-label {
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        
        .status-value {
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 6px;
        }
        
        .status-indicator.connected {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
        
        .status-indicator.disconnected {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }
        
        .button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px 18px;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: center;
            user-select: none;
        }
        
        .button:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .button.primary {
            background: rgba(16, 185, 129, 0.3);
            border-color: rgba(16, 185, 129, 0.5);
        }
        
        .button.danger {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
        }
        
        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .control-button {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
        }
        
        .control-button:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.4);
        }
        
        .control-button.large {
            font-size: 24px;
        }
        
        .control-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .speed-control {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }
        
        .speed-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .speed-value {
            font-size: 18px;
            font-weight: bold;
        }
        
        .speed-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }
        
        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .speed-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .connection-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .auto-section {
            margin-bottom: 8px;
        }
        
        .auto-info {
            margin-top: 6px;
            font-size: 11px;
            opacity: 0.8;
            text-align: center;
        }
        
        .arrow-up::before { content: "▲"; }
        .arrow-down::before { content: "▼"; }
        .arrow-left::before { content: "◀"; }
        .arrow-right::before { content: "▶"; }
        .rotate-left::before { content: "⟲"; }
        .rotate-right::before { content: "⟳"; }
        .stop-icon::before { content: "■"; }
        
        @media (max-width: 480px) {
            body {
                padding: 6px;
            }
            
            .header h1 {
                font-size: 16px;
            }
            
            .control-button {
                font-size: 16px;
            }
            
            .control-button.large {
                font-size: 22px;
            }
            
            .status-value {
                font-size: 13px;
            }
            
            .button {
                padding: 8px 15px;
                font-size: 12px;
            }
        }
        
        @media (max-width: 380px) {
            .control-button {
                font-size: 14px;
            }
            
            .control-button.large {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 LEGO Control + 📷</h1>
        </div>
        
        <!-- Video Stream -->
        <div class="video-container">
            <div class="video-wrapper">
                <img src="/video_feed" class="video-stream" alt="Camera Stream">
                <div class="video-overlay">
                    <span id="camera-fps">FPS: --</span>
                </div>
            </div>
        </div>
        
        <!-- Connection -->
        <div class="connection-buttons">
            <button class="button primary" id="connect-btn" onclick="connect()">
                Verbinden
            </button>
            <button class="button danger" id="disconnect-btn" onclick="disconnect()" disabled>
                Trennen
            </button>
        </div>
        
        <!-- Autonomous Mode -->
        <div class="status-card auto-section">
            <button class="button" id="auto-btn" onclick="toggleAutonomous()" 
                    style="background: rgba(255, 165, 0, 0.3); border-color: rgba(255, 165, 0, 0.5);" disabled>
                🤖 Auto-Modus
            </button>
            <div class="auto-info">
                Fahrzeug weicht automatisch aus
            </div>
        </div>
        
        <!-- Speed Control -->
        <div class="speed-control">
            <div class="speed-label">
                <span>Geschwindigkeit</span>
                <span class="speed-value"><span id="speed-value">50</span>%</span>
            </div>
            <input type="range" min="10" max="100" value="50" class="speed-slider" 
                   id="speed-slider" onchange="updateSpeed(this.value)" disabled>
        </div>
        
        <!-- Controls -->
        <div class="status-card">
            <div class="control-grid">
                <div></div>
                <button class="control-button large arrow-up" id="btn-forward" 
                        ontouchstart="startCommand('forward')" ontouchend="stopCommand()"
                        onmousedown="startCommand('forward')" onmouseup="stopCommand()"
                        disabled></button>
                <div></div>
                
                <button class="control-button arrow-left" id="btn-left"
                        ontouchstart="startCommand('left')" ontouchend="stopCommand()"
                        onmousedown="startCommand('left')" onmouseup="stopCommand()"
                        disabled></button>
                <button class="control-button large stop-icon" id="btn-stop"
                        onclick="sendCommand('stop')" disabled></button>
                <button class="control-button arrow-right" id="btn-right"
                        ontouchstart="startCommand('right')" ontouchend="stopCommand()"
                        onmousedown="startCommand('right')" onmouseup="stopCommand()"
                        disabled></button>
                
                <button class="control-button rotate-left" id="btn-pivot-left"
                        ontouchstart="startCommand('pivot_left')" ontouchend="stopCommand()"
                        onmousedown="startCommand('pivot_left')" onmouseup="stopCommand()"
                        disabled></button>
                <button class="control-button large arrow-down" id="btn-backward"
                        ontouchstart="startCommand('backward')" ontouchend="stopCommand()"
                        onmousedown="startCommand('backward')" onmouseup="stopCommand()"
                        disabled></button>
                <button class="control-button rotate-right" id="btn-pivot-right"
                        ontouchstart="startCommand('pivot_right')" ontouchend="stopCommand()"
                        onmousedown="startCommand('pivot_right')" onmouseup="stopCommand()"
                        disabled></button>
            </div>
        </div>
        
        <!-- Status (kompakt unten) -->
        <div class="status-card">
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">Hub</div>
                    <div class="status-value">
                        <span id="status-text">Aus</span>
                        <span id="status-indicator" class="status-indicator disconnected"></span>
                    </div>
                </div>
                <div class="status-item">
                    <div class="status-label">Kamera</div>
                    <div class="status-value">
                        <span id="camera-status">Aktiv</span>
                    </div>
                </div>
                <div class="status-item">
                    <div class="status-label">Befehl</div>
                    <div class="status-value" id="last-command" style="font-size: 12px;">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Speed</div>
                    <div class="status-value"><span id="speed-display">50</span>%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let connected = false;
        let currentSpeed = 50;
        let activeCommand = null;
        let autonomousMode = false;
        
        // Status regelmäßig aktualisieren
        setInterval(updateStatus, 1000);
        
        async function connect() {
            document.getElementById('connect-btn').disabled = true;
            document.getElementById('connect-btn').textContent = 'Verbinde...';
            
            try {
                const response = await fetch('/api/connect', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.success) {
                    connected = true;
                    updateUI();
                    alert('✓ Verbunden mit LEGO Hub!');
                } else {
                    alert('✗ Verbindung fehlgeschlagen: ' + data.status);
                }
            } catch (error) {
                alert('✗ Fehler: ' + error.message);
            }
            
            document.getElementById('connect-btn').disabled = false;
            document.getElementById('connect-btn').textContent = 'Verbinden';
        }
        
        async function disconnect() {
            // Autonomen Modus zuerst stoppen
            if (autonomousMode) {
                await toggleAutonomous();
            }
            
            try {
                await fetch('/api/disconnect', {
                    method: 'POST'
                });
                connected = false;
                updateUI();
                alert('Verbindung getrennt');
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }
        
        async function toggleAutonomous() {
            const btn = document.getElementById('auto-btn');
            
            try {
                btn.disabled = true;
                
                const response = await fetch('/api/autonomous/toggle', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enable: !autonomousMode})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    autonomousMode = data.autonomous;
                    updateUI();
                } else {
                    alert('Fehler: ' + (data.error || 'Unbekannter Fehler'));
                }
            } catch (error) {
                alert('Fehler: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }
        
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                connected = data.connected;
                document.getElementById('status-text').textContent = data.status;
                document.getElementById('last-command').textContent = data.last_command;
                document.getElementById('camera-fps').textContent = `FPS: ${data.camera_fps}`;
                document.getElementById('camera-status').textContent = data.camera_enabled ? 'Aktiv' : 'Inaktiv';
                document.getElementById('speed-display').textContent = data.speed;
                
                const indicator = document.getElementById('status-indicator');
                if (data.connected) {
                    indicator.className = 'status-indicator connected';
                } else {
                    indicator.className = 'status-indicator disconnected';
                }
                
                // Autonomen Status aktualisieren
                const autoResponse = await fetch('/api/autonomous/status');
                const autoData = await autoResponse.json();
                autonomousMode = autoData.autonomous;
                
                updateUI();
            } catch (error) {
                // Server nicht erreichbar
            }
        }
        
        function updateUI() {
            const controls = [
                'btn-forward', 'btn-backward', 'btn-left', 'btn-right',
                'btn-pivot-left', 'btn-pivot-right', 'btn-stop'
            ];
            
            // Normale Steuerung nur aktiv wenn nicht im Auto-Modus
            const manualEnabled = connected && !autonomousMode;
            controls.forEach(id => {
                document.getElementById(id).disabled = !manualEnabled;
            });
            
            document.getElementById('disconnect-btn').disabled = !connected;
            document.getElementById('speed-slider').disabled = !connected;
            document.getElementById('auto-btn').disabled = !connected;
            
            // Auto-Button Text und Farbe
            const autoBtn = document.getElementById('auto-btn');
            if (autonomousMode) {
                autoBtn.textContent = '⏸️ Auto Stoppen';
                autoBtn.style.background = 'rgba(239, 68, 68, 0.3)';
                autoBtn.style.borderColor = 'rgba(239, 68, 68, 0.5)';
            } else {
                autoBtn.textContent = '🤖 Auto Starten';
                autoBtn.style.background = 'rgba(255, 165, 0, 0.3)';
                autoBtn.style.borderColor = 'rgba(255, 165, 0, 0.5)';
            }
        }
        
        function updateSpeed(value) {
            currentSpeed = parseInt(value);
            document.getElementById('speed-value').textContent = currentSpeed;
            
            fetch('/api/speed', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({speed: currentSpeed})
            });
        }
        
        async function sendCommand(command) {
            if (!connected || autonomousMode) return;
            
            try {
                await fetch('/api/control', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        command: command,
                        speed: currentSpeed
                    })
                });
            } catch (error) {
                console.error('Command error:', error);
            }
        }
        
        function startCommand(command) {
            if (!connected || activeCommand || autonomousMode) return;
            activeCommand = command;
            sendCommand(command);
        }
        
        function stopCommand() {
            if (!connected || !activeCommand || autonomousMode) return;
            activeCommand = null;
            sendCommand('stop');
        }
        
        // Verhindere Scroll beim Touch
        document.body.addEventListener('touchmove', (e) => {
            if (e.target.classList.contains('control-button')) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Initial UI update
        updateUI();
    </script>
</body>
</html>
